<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 · Game Over</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&family=Press+Start+2P&display=swap" />
  <!-- Served by GitHub Pages for unknown paths. Static file: it is not processed by Vite, so the base path is hard-coded. -->
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: #0f0f1b; color: #f4f4f4; font: 20px/1.6 'Pixelify Sans', monospace; text-align: center;
    }
    h1 { font: 32px/1.4 'Press Start 2P', monospace; color: #ffcd75; text-shadow: 4px 4px 0 #b13e53; }
    .code { font: 12px 'Press Start 2P', monospace; color: #94b0c2; margin-bottom: 24px; }
    p { margin-top: 24px; }
    a {
      display: inline-block; margin-top: 32px; padding: 14px 20px; min-height: 44px;
      font: 12px 'Press Start 2P', monospace; text-transform: uppercase; text-decoration: none;
      background: #ffcd75; color: #0f0f1b;
      box-shadow: 0 -4px 0 0 #f4f4f4, 0 4px 0 0 #f4f4f4, -4px 0 0 0 #f4f4f4, 4px 0 0 0 #f4f4f4, inset -4px -4px 0 0 rgb(0 0 0 / .3);
    }
    a:focus-visible { outline: 4px solid #ffcd75; outline-offset: 8px; }
    a:active { transform: translateY(4px); }
  </style>
</head>

<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Game Over</h1>
    <p>This level doesn't exist.</p>
    <a href="/fattsowavyy/">Continue</a>
  </main>
</body>

</html>
