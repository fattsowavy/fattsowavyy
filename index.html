  <!-- Apply saved theme / FX before first paint to avoid a flash -->
  <script>
    try {
      var d = document.documentElement;
      if (localStorage.getItem('px-theme') === 'gb') d.dataset.theme = 'gb';
      if (localStorage.getItem('px-fx') === 'off') d.dataset.fx = 'off';
    } catch (e) { }
  </script>

  <!-- Pixel fonts, loaded without blocking render -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&family=Press+Start+2P&display=swap" />
